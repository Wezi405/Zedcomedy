<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZedComedy 🇿🇲</title>
<style>
body{margin:0;background:#101010;color:#fff;font-family:Arial;padding-bottom:75px}header{padding:16px;background:#101010;position:sticky;top:0}h1{margin:0}.logo b{color:#ffc400}input{width:100%;padding:13px;margin-top:12px;border-radius:25px;background:#222;color:#fff;border:1px solid #444}main{padding:15px}.page{display:none}.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card,.profile{background:#1c1c1c;border:1px solid #333;border-radius:17px;padding:12px}.avatar{height:105px;border-radius:14px;background:linear-gradient(135deg,#ffc400,#765500);display:grid;place-items:center;font-size:52px}.card h3{margin:8px 0 4px}.muted{color:#aaa;font-size:12px}button{border:0;border-radius:10px;padding:10px;background:#ffc400;font-weight:bold}button.follow{width:100%;margin-top:9px}.back{background:#292929;color:#fff;margin-bottom:10px}.stats{display:flex;justify-content:space-around;margin:18px 0}.stats b{display:block;font-size:20px}.stats span{color:#aaa;font-size:11px}.clip{background:#1c1c1c;border:1px solid #333;border-radius:17px;padding:12px;margin:10px 0}.thumb{height:170px;border-radius:14px;background:linear-gradient(135deg,#ffc400,#765500);display:grid;place-items:center;font-size:65px}nav{position:fixed;bottom:0;left:0;right:0;height:68px;background:#181818;display:flex;border-top:1px solid #333}nav button{flex:1;background:none;color:#888}nav button.active{color:#ffc400}
</style></head><body>
<header><h1 class="logo">😎 Zed<b>Comedy</b> 🇿🇲</h1><div class="muted">Discover Zambian Talent</div><input id="q" placeholder="🔎 Search comedians..." oninput="render()"></header>
<main>
<section id="home" class="page active"><h2>Welcome to ZedComedy</h2><p class="muted">Discover funny Zambian creators.</p><h2>Popular</h2><div id="popular" class="grid"></div></section>
<section id="discover" class="page"><h2>Discover Comedians 🇿🇲</h2><div id="grid" class="grid"></div></section>
<section id="profile" class="page"><div id="prof"></div><h2>Comedy Clips 🎬</h2><div id="posts"></div></section>
<section id="upload" class="page"><h2>Upload 🎬</h2><div class="card"><p>Choose a comedy video from your phone.</p><input type="file" accept="video/*"><br><button style="margin-top:12px" onclick="alert('Cloud video uploads are the next backend upgrade.')">Continue</button></div></section>
</main>
<nav><button class="active" onclick="page('home',this)">🏠<br>Home</button><button onclick="page('discover',this)">🔎<br>Discover</button><button onclick="page('upload',this)">➕<br>Upload</button></nav>
<script>
const C=[
['@MambweComedy','Skits','😂','Everyday Zambian comedy',12400,28,48200],
['@BembaLaughs','Stand-up','🤣','Stand-up & funny stories',8900,21,31500],
['@LusakaFunny','Skits','😎','Lusaka comedy creator',7100,19,26700],
['@CopperbeltComedy','Music comedy','🎤','Music + comedy',6400,16,22100],
['@ZedJokes','Skits','😆','Short funny skits',5200,14,18700],
['@LaughsZambia','Stand-up','😁','New Zambian talent',3900,11,12900]
];
function page(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');scrollTo(0,0)}
function follow(b){b.textContent=b.textContent==='Follow'?'Following ✓':'Follow'}
function openProfile(i){let c=C[i];prof.innerHTML='<div class="profile"><div style="font-size:80px">'+c[2]+'</div><h2>'+c[0]+'</h2><p class="muted">'+c[3]+'</p><div class="stats"><div><b>'+c[4].toLocaleString()+'</b><span>Followers</span></div><div><b>'+c[5]+'</b><span>Clips</span></div><div><b>'+c[6].toLocaleString()+'</b><span>Likes</span></div></div><button class="follow" onclick="follow(this)">Follow</button></div>';posts.innerHTML='<div class="clip"><div class="thumb">'+c[2]+'</div><h3>Latest '+c[1]+' 😂</h3><p class="muted">Funny moments from '+c[0]+'</p><button onclick="like(this)">❤️ Like</button></div><div class="clip"><div class="thumb">🤣</div><h3>Another ZedComedy moment</h3><p class="muted">Support local comedy 🇿🇲</p></div>';page('profile')}
function like(b){b.textContent=b.textContent.includes('Liked')?'❤️ Like':'❤️ Liked'}
function render(){let q=document.getElementById('q').value.toLowerCase();let a=C.filter(c=>c[0].toLowerCase().includes(q)||c[3].toLowerCase().includes(q));grid.innerHTML=a.map(c=>{let i=C.indexOf(c);return '<div class="card" onclick="openProfile('+i+')"><div class="avatar">'+c[2]+'</div><h3>'+c[0]+'</h3><p class="muted">'+c[1]+' • '+c[3]+'</p><button class="follow" onclick="event.stopPropagation();follow(this)">Follow</button></div>'}).join('')||'<p class="muted">No comedians found.</p>';popular.innerHTML=C.slice(0,4).map((c,i)=>'<div class="card" onclick="openProfile('+i+')"><div class="avatar">'+c[2]+'</div><h3>'+c[0]+'</h3><p class="muted">'+c[1]+'</p></div>').join('')}
render();
</script></body></html>
